services:
    ui:
        image: nginx:alpine
        volumes:
            - ./ui/index.html:/usr/share/nginx/html/index.html:ro
            - ./ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        ports:
            - "3000:3000"
        depends_on:
            - app

    app:
        build: .
        ports:
            - "8080:8080"
        environment:
            KAFKA_BOOTSTRAP_SERVERS: kafka:9092
            REDIS_HOST: redis
            SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tollfree
            JWT_SECRET: change-this-to-a-32-byte-minimum-secret-key
            MAIL_HOST: mailhog
            MAIL_PORT: 1025
            MAIL_FROM: noreply@tollfree.local
        depends_on:
            postgres:
                condition: service_healthy
            kafka:
                condition: service_started
            redis:
                condition: service_started
            mailhog:
                condition: service_started

    mailhog:
        image: mailhog/mailhog:latest
        ports:
            - "1025:1025"
            - "8025:8025"

    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: tollfree
            POSTGRES_USER: tollfree
            POSTGRES_PASSWORD: tollfree
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U tollfree -d tollfree"]
            interval: 5s
            timeout: 5s
            retries: 10
        ports:
            - "5432:5432"

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"

    kafka:
        image: apache/kafka:3.9.0
        container_name: kafka
        ports:
            - "9092:9092"
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_NUM_PARTITIONS: 3
